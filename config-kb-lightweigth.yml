---
downloads: ~/.ansible-downloads/

configure_dotfiles: true
configure_terminal: false
configure_osx: true
configure_sudoers: false

# Doc to be configured
# Set to 'true' to configure the Dock via dockutil.
configure_dock: true
dockitems_remove: 
  - TV
  - Podcasts
  - Music
  - Numbers
  - Keynote
  - FaceTime
  - Contacts
  - Reminders
  - Pages
  - App Store
  - Photos

dockitems_persist:
  - name: Google Chrome
    path: "/Applications/Google Chrome.app"
  - name: Spotify
    path: "/Applications/Spotify.app"
  - name: Slack
    path: "/Applications/Slack.app"
  - name: Kindle
    path: "/Applications/Kindle.app"
  

dotfiles_repo: git@github.com:kamil-baran/dotfiles.git
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/Dev/MacSetup/dotfiles
# Would be easier to link just all files in dir
dotfiles_files:
  - .zshrc
  - .vimrc
  - .osx
  - .gitconfig
  - .gitconfig-work
  - .aliases

homebrew_installed_packages:
  - aws-iam-authenticator
  - awscli
  - bash-completion
  - git 
  - jenv
  - jq
  - nvm
  - pyenv
  - tree
  - watch
  - wget
  - pyenv-virtualenv
  - pre-commit

homebrew_taps:
  - homebrew/core
  - homebrew/cask
  - homebrew/cask-versions

homebrew_cask_appdir: /Applications
homebrew_cask_apps:
  - anki
  - cheatsheet
  - chromedriver
  - docker
  - firefox
  - google-chrome
  - iterm2
  - kindle
  - krita
  - signal
  - spotify
  - visual-studio-code
  - whatsapp
  - obsidian
  - pdf-expert
  - google-cloud-sdk
  - tomatobar
  - vlc
  - cursor
  - discord

